[package]
name = "airpods-battery-service"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native Rust Bluetooth backend for the KDE Plasma AirPods battery widget"

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "5.11.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = true
